<h2>Add Student</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Name" required><br><br>

    <input type="text" name="register_number"
           placeholder="Register Number" required><br><br>

    <input type="text" name="department"
           placeholder="Department" required><br><br>

    <input type="number" name="year"
           placeholder="Year" required><br><br>

    <input type="email" name="email"
           placeholder="Email" required><br><br>

    <input type="text" name="phone"
           placeholder="Phone" required><br><br>

    <input type="number" step="0.01" name="cgpa"
           placeholder="CGPA" required><br><br>

    <button type="submit">Add Student</button>
</form>

<a href="{% url 'home' %}">Back</a>
